<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>アキコン｜実家じまい相談サービス</title>
    <!-- meta情報 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- noindex 検索させたくない時だけ入れる-->
    <meta name="robots" content="noindex, nofollow">
    <!-- OGP情報 -->
    <!-- ページのタイトル -->
    <meta property="og:title" content="実家じまいのご相談は「アキコン」へ">
    <!-- ページの説明 -->
    <meta property="og:description" content="実家じまいサービスが提供する「アキコン」。無料相談、現地調査、相場レポート送付のお申込みはこちらから。">
    <!-- ページのイメージ画像 -->
    <meta property="og:image" content="https://akiconsys.com/akicon-ogp.png" />
    <!-- ファビコン -->
    <link rel="shortcut icon" href="https://akiconsys.com/akicon/favicon.ico" />
    <!-- iOSデバイス（iPhone・iPad） で Webサイトをホーム画面に追加したときに表示されるアイコン を指定するタグ -->
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <link rel="icon" type="image/png" href="../android-chrome-192x192.png">
    <!-- Googleフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">
    <!-- css -->
    <link href="../css/reset.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <!-- JavaScript -->
    <script defer src="../js/script.js"></script>
    <script type="module" defer src="../js/checkTokenExists.js"></script>
    <script type="module" defer src="../js/common.js"></script>
  </head>

  <body class="slide__body">

      <!-- ヘッダー -->
      <header class="header slide__header">
        <h1 class="header__logo aki-logo"><img src="../images/aki-logo.png" alt="アキコン"></h1>
        <div class="slide__page"><img src="../images/slide07_page-img.png" alt="02 空き家放置の現状"></div>
        <p class="slide__page-text"><span class="slide__page-text-span">07</span>/ 14</p>
      </header>
      <main>
        <div class="inner">
          <section class="section__container">
            <div class="section__bg slide07__bg">
              <div class="inner slide__inner">
                <h2 class="section__title slide07__title">早く手離しておけば良かった…<br>と後悔することも</h2>
                <figure class="slide07-img">
                  <img src="../images/slide07-img.png" alt="相続直後 評価額：1000万円 想定していた資産価値が維持できず 評価額：200万円">
                </figure>
                <div class="slide07__container">
                  <div class="slide07__container-img"><img src="../images/jimarun-icon.png" alt="実家じまいマスコットキャラクター じまるん"></div>
                  <p class="slide07__container-text">2015年から2020年まで<span class="slide__container-text-span">5年間空き家として放置</span>していた事例です。<br>問題を先送りにしたことで、<span class="slide__container-text-span">800万円の損失</span>が出てしまいました。<br>この様な事例は全国で起こっています。</p>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
      <footer class="slide__footer footer">
        <a href="../slide00/" class="top__btn" onclick="return showConfirmModal()">トップページ</a>
        <div>
          <a href="../slide06/" class="back__btn">もどる</a>
          <a href="../slide08/" class="next__btn">すすむ</a>
        </div>
      </footer>
      <!-- 引入确认模态框 -->
      <div id="confirmModalContainer"></div>

  </body>
</html>
