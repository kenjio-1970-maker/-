<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>アキコン｜実家じまい相談サービス</title>
    <!-- meta情報 -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- noindex 検索させたくない時だけ入れる-->
    <meta name="robots" content="noindex, nofollow" />
    <!-- OGP情報 -->
    <!-- ページのタイトル -->
    <meta property="og:title" content="実家じまいのご相談は「アキコン」へ">
    <!-- ページの説明 -->
    <meta property="og:description" content="実家じまいサービスが提供する「アキコン」。無料相談、現地調査、相場レポート送付のお申込みはこちらから。">
    <!-- ページのイメージ画像 -->
    <meta property="og:image" content="https://akiconsys.com/akicon/akicon-ogp.png" />
    <!-- ファビコン -->
    <link rel="shortcut icon" href="https://akiconsys.com/akicon/favicon.ico" />
    <!-- iOSデバイス（iPhone・iPad） で Webサイトをホーム画面に追加したときに表示されるアイコン を指定するタグ -->
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="../android-chrome-192x192.png" />
    <!-- Googleフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&family=Noto+Serif+JP:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <!-- css -->
    <link href="../css/reset.css" rel="stylesheet" />
    <link href="../css/form.css" rel="stylesheet" />
    <script type="module" defer src="../js/checkTokenExists.js"></script>
    <script type="module" defer src="../js/form12.js"></script>
  </head>

  <body class="slide__body">

      <!-- ヘッダー -->
      <header class="header form__header">
        <h1 class="header__logo aki-logo"><img src="../images/aki-logo.png" alt="アキコン" /></h1>
        <div class="form__title-wrapper">
          <h2 class="form__title">実家じまい相談フォーム</h2>
              <p class="form__title-text">下記フォームからお客様のご実家に関する情報をご入力ください。</p>
        </div>
      </header>
      <main class="main form12__main">
        <div class="inner">
        <section class="form__container">
          <div class="form__bg">
            <div class="inner form__inner">
              <div class="form__box">
                <div class="box__bg">
                  <div class="box__inner">
                    <h3 class="form__q">Q12. 相談者様の情報をお聞かせください。</h3>
                    <form class="form12__box">
                      <div class="form__inner">
                        <div class="form12__information">
                          <div class="form12__row">
                            <div class="form12__group">
                              <label>氏名<span class="form__q-span">(必須)</span></label>
                              <input type="text" class="form12__group-text" placeholder="実家　太郎" name="Q12(1)">
                            </div>

                            <div class="form12__group">
                              <label>ふりがな<span class="form__q-span">(必須)</span></label>
                              <input type="text" class="form12__group-text" placeholder="じっか　たろう" name="Q12(2)">
                            </div>

                            <div class="form12__group">
                              <label>電話番号<span class="form__q-span">（必須・数字）</span></label>
                              <input type="tel" class="form12__group-text" placeholder="09012345678" name="Q12(3)"  maxlength="11">
                            </div>
                          </div>
                        </div>
                        <div class="form12__label">
                          <p>現在お住まいのご住所<span class="form__q-span">(必須)</span></p>
                          <p class="form12__label-text">※今後、資料をお送りする場合がございますので、郵送物が届くご住所をお聞かせください。</p>
                          <div class="form12__address">
                            <div class="form12__address-post">
                              <label>〒</label>
                              <div class="form11-2__post">
                                <input type="text" class="post-code" maxlength="3" size="3" name="Q12(4)-start">
                                <span class="post-hyphen">ー</span>
                                <input type="text" class="post-code02" maxlength="4" size="4" name="Q12(4)-end">
                              </div>
                              <button class="form12__post-search" type="button" onclick="fetchAndPopulateAddress()">検索</button>
                            </div>
                            <div class="form12__address-box">
                              <label>住所</label>
                                <input type="text" class="address-text" maxlength="300" placeholder="東京都**区**" name="Q12(5)" disabled>
                            </div>
                            <div class="form12__address-box">
                              <label>番地以降</label>
                                <input type="text" class="address-text" maxlength="50" placeholder="1-1-1" name="Q12(6)">
                            </div>
                          </div>
                        </div>
                        <div class="form12__information">
                          <div class="form12__row">
                            <div class="form12__group">
                              <label for="age">年齢</label>
                              <select id="age" class="form12__group-text02" name="Q12(7)">
                                <option value="">選択してください</option>
                                <option value="3">30代</option>
                                <option value="4">40代</option>
                                <option value="5">50代</option>
                                <option value="6">60代</option>
                                <option value="7">70代以上</option>
                              </select>
                            </div>
                            <div class="form12__group">
                              <label for="gender">性別</label>
                              <select id="gender" class="form12__group-text02" name="Q12(8)">
                                <option value="">選択してください</option>
                                <option value="2">男性</option>
                                <option value="1">女性</option>
                                <option value="3">その他</option>
                                <option value="4">回答しない</option>
                              </select>
                            </div>

                            <div class="form12__group">
                              <label>ご職業</label>
                              <select id="job" class="form12__group-text02" name="Q12(9)">
                                <option value="">選択してください</option>
                                <option value="1">会社員・役員</option>
                                <option value="2">自営業</option>
                                <option value="3">公務員</option>
                                <option value="4">学生</option>
                                <option value="5">専業主婦</option>
                                <option value="6">パート・アルバイト</option>
                                <option value="7">無職</option>
                                <option value="8">その他</option>
                              </select>
                            </div>
                          </div>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
      </main>
      <footer class="slide__footer form__footer form12__footer__down">
        <a href="../slide00/" class="top__btn" onclick="return showConfirmModal()">トップページ</a>
        <div>
          <a href="../form/form11-2.html" class="back__btn">もどる</a>
          <a href="../form/form13.html" class="next__btn">すすむ</a>
        </div>
      </footer>
      <!-- 引入确认模态框 -->
      <div id="confirmModalContainer"></div>
  </body>

</html>
