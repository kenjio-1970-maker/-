<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>アキコン｜実家じまい相談サービス</title>
    <!-- meta情報 -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- noindex 検索させたくない時だけ入れる-->
    <meta name="robots" content="noindex, nofollow" />
    <!-- OGP情報 -->
    <!-- ページのタイトル -->
    <meta property="og:title" content="実家じまいのご相談は「アキコン」へ">
    <!-- ページの説明 -->
    <meta property="og:description" content="実家じまいサービスが提供する「アキコン」。無料相談、現地調査、相場レポート送付のお申込みはこちらから。">
    <!-- ページのイメージ画像 -->
    <meta property="og:image" content="https://akiconsys.com/akicon/akicon-ogp.png" />
    <!-- ファビコン -->
    <link rel="shortcut icon" href="https://akiconsys.com/akicon/favicon.ico" />
    <!-- iOSデバイス（iPhone・iPad） で Webサイトをホーム画面に追加したときに表示されるアイコン を指定するタグ -->
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="../android-chrome-192x192.png" />
    <!-- Googleフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&family=Noto+Serif+JP:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <!-- css -->
    <link href="../css/reset.css" rel="stylesheet" />
    <link href="../css/form.css" rel="stylesheet" />
    <script type="module" defer src="../js/checkTokenExists.js"></script>
    <script type="module" defer src="../js/thanks.js"></script>

  </head>

  <body class="slide__body">
      <!-- ヘッダー -->
      <header class="header form__header thanks__header">
        <h1 class="header__logo aki-logo"><img src="../images/aki-logo.png" alt="アキコン" /></h1>
      </header>
      <main class="main thanks__main">
        <div class="inner">
          <section class="form__container">
            <div class="form__bg">
              <div class="inner form__inner">
                <div class="form__box">
                  <div class="box__bg">
                    <div class="box__inner thanks__inner">
                      <h3 class="thanks__title">【送信完了いたしました】</h3>
                      <p class="thanks__title-text">この度は相談フォームにご入力いただき、誠にありがとうございます。<br> 内容を確認の上、ご希望の連絡手段にて近隣の相場レポートをお送りいたします。 <br>ご不明点がございましたら、お気軽にお問合せください。</p>
                      <div class="thanks__contact-info">
                        <p class="contact-info-title">＜お問合せ先＞</p>
                        <p class="contact-info__company">株式会社RICS</p>
                        <p class="contact-info__text">実家じまい相談窓口<span class="contact-info__email">soudan@rics.co.jp</span></p>
                      </div>
                      <div class="company-info">
                        <div class="company-info-item">
                          <div class="company-info-item-box">
                            <p>LINE公式アカウント</p>
                            <div class="company-info-qr"><img src="../images/line-qr.png" alt="実家じまい事務局LINE公式アカウント"></div>
                          </div>
                          <p class="company-info-text">LINE公式アカウントをご用意しております。 <br>ご登録いただくことで、今後のご連絡が<br>よりスムーズになりますので、ぜひご利用ください。</p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
      <footer class="slide__footer form__footer">
        <a href="../slide00/" class="top__btn" onclick="return showConfirmModal()">トップページ</a>
        <div>
          <a href="../slide00/" class="next__btn">終了する</a>
        </div>
      </footer>
      <!-- 引入确认模态框 -->
      <div id="confirmModalContainer"></div>

  </body>
</html>
