  <body class="slide__body">

      <!-- ヘッダー -->
      <header class="header">
        <h1 class="header__logo aki-logo"><img src="../images/aki-logo.png" alt="アキコン" /></h1>
        <div class="form__title-wrapper">
          <h2 class="form__title">実家じまい相談フォーム</h2>
              <p class="form__title-text">下記フォームからお客様のご実家に関する情報をご入力ください。</p>
        </div>
      </header>
      <main>
        <div class="inner">
        <section class="form__container">
          <div class="form__bg">
            <div class="inner form__inner">
              <div class="form__box">
                <div class="box__bg">
                  <div class="box__inner">
                    <h3 class="form__q">Q8. 維持管理の頻度について教えてください。</h3>
                    <div class="form05__box">
                      <label class="radio__inner" hidden=""></label>
                      <label class="radio__inner form08__checkbox">
                        <input type="radio" name='Q8' value="1">週に1回以上
                      </label>
                      <label class="radio__inner form08__checkbox">
                        <input type="radio" name='Q8' value="2">2週に1回程度
                      </label>
                      <label class="radio__inner form08__checkbox">
                        <input type="radio" name='Q8' value="3">月に1回程度
                      </label>
                      <label class="radio__inner form08__checkbox">
                        <input type="radio" name='Q8' value="4">6ヶ月に1回程度
                      </label>
                      <label class="radio__inner form08__checkbox">
                        <input type="radio" name='Q8' value="5">年に1回程度
                      </label>
                      <label class="radio__inner form08__checkbox">
                        <input type="radio" name='Q8' value="6">ほとんどしていない
                      </label>
                      <label class="radio__inner form08__checkbox">
                        <input type="radio" name='Q8' value="7">1度もしたことない
                      </label>
                      <label class="radio__inner form08__checkbox">
                        <input type="radio" name='Q8' value="8">わからない
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
